<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Participation 12</title>
        <script>
            function changeText() {
                let newBox = document.getElementById("box");
                newBox.textContent = "Orange Nation";
                newBox.style.color = "orange";
            }
        </script>
    </head>

    <body>
        <div id="box" onclick="changeText()">Syracuse University</div>
    </body>

</html>
